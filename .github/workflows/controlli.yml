# I controlli che girano da soli.
#
# Tutto quello che c'e' qui dentro esisteva gia' come comando: pytest,
# tsc, migrate.py, check_kb_registry.py. Mancava che qualcosa li lanciasse
# senza che nessuno se lo ricordasse, ed e' quello il valore. Il conto della
# dimenticanza, pagato prima che questo file esistesse: `Knight Shield` doppio
# in produzione per mesi, `Quetzalcoatlus` e `T.Rex` idem, cinque alias che
# erano frammenti di wikitext, tre migrazioni applicate ma non registrate.
# check_kb_registry.py da solo avrebbe visto i primi quattro.
#
# Tre lavori, e girano in parallelo:
#
#   veloce     nessun servizio, nessun segreto: test e tipi
#   database   un Postgres con pgvector, ripristinato da docker/ci-db.sql.gz
#   immagini   le due build vere, che prendono cio' che i tipi non vedono
#
# I due gate del RAG (eval_retrieval, eval_generation) NON stanno qui: costano
# chiamate a pagamento e vanno in notturna, non a ogni push.

# Actions e' tornato disponibile: questo file gira davvero. Gli stessi
# controlli restano lanciabili in locale con `npm run controlli`, e
# `npm run hooks:install` li attacca al pre-push - il punto non e' piu'
# supplire alla CI, e' scoprire un guasto prima di aspettare il suo giro.
#
# I controlli di SICUREZZA stanno in sicurezza.yml, non qui: sono due linee
# separate perche' rispondono a domande diverse ("funziona?" contro "e'
# sicuro?") e perche' una delle due si puo' rompere senza fermare l'altra.

name: controlli

# Il token di questo workflow legge e basta. Senza questo blocco eredita il
# default del repo, che qui era scrittura su tutto: un `npm ci` con dentro una
# dipendenza compromessa avrebbe potuto riscrivere il codice o muovere i tag.
# Nessuno di questi tre lavori scrive niente, quindi non toglie nulla.
permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  veloce:
    name: test e tipi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: dipendenze del backend
        working-directory: backend-py
        run: uv sync --frozen

      # Senza DATABASE_URL i test che toccano il database si saltano da soli:
      # e' la stessa condizione che usano in locale, e tiene la suite veloce
      # onesta invece che silenziosamente parziale.
      - name: test senza database
        working-directory: backend-py
        # `python -m pytest` e non `pytest`: solo il primo mette la cartella
        # corrente nel path, e senza quella i test non trovano il pacchetto
        # `app`. Scoperto lanciandoli in locale, non qui: questo lavoro
        # sarebbe stato rosso alla prima esecuzione.
        run: uv run python -m pytest -q

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: dipendenze del frontend
        working-directory: frontend
        run: npm ci

      - name: i tipi del frontend
        working-directory: frontend
        run: npx tsc --noEmit

  database:
    name: database e integrita'
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector e non postgres: la migrazione 0010 vuole l'estensione
        # `vector`, e l'immagine ufficiale non ce l'ha. E' lo stesso motivo per
        # cui la produzione ha dovuto cambiare risorsa.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beyblade_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beyblade_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beyblade_tracker

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: dipendenze del backend
        working-directory: backend-py
        run: uv sync --frozen

      # Il database NON si costruisce applicando le migrazioni da vuoto: la
      # catena parte da uno schema che ai tempi generava Drizzle, e la 0003 si
      # ferma subito ("relation external_player_combos does not exist").
      # Finche' resta cosi', il punto di partenza e' un dump.
      #
      # docker/ci-db.sql.gz e' il database di sviluppo SENZA i dati personali -
      # niente utenti, sessioni, chat, preferiti, registro delle azioni - e
      # senza gli embedding, che pesano 25 MB e qui non servono a nessun
      # controllo.
      - name: ripristina il database di prova
        run: |
          zcat docker/ci-db.sql.gz | psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1

      # Esce 1 se una migrazione e' stata modificata dopo essere stata
      # applicata, o se ce n'e' una nel repo che il dump non conosce.
      - name: le migrazioni e il database concordano
        run: uv run --project backend-py python tools/migrate.py --url "$DATABASE_URL" --status

      # Doppioni nel registro, alias che puntano a due pezzi, la coppia piu'
      # vicina sotto la soglia dei refusi, schede senza voce e viceversa.
      - name: integrita' del registro dei pezzi
        run: uv run --project backend-py python tools/check_kb_registry.py --url "$DATABASE_URL"

      - name: test col database
        working-directory: backend-py
        # `python -m pytest` e non `pytest`: solo il primo mette la cartella
        # corrente nel path, e senza quella i test non trovano il pacchetto
        # `app`. Scoperto lanciandoli in locale, non qui: questo lavoro
        # sarebbe stato rosso alla prima esecuzione.
        run: uv run python -m pytest -q

  immagini:
    name: le immagini si costruiscono
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Non e' un doppione di `tsc`. Il difetto che fermo' il rilascio di
      # agosto - `cross-env not found`, perche' NODE_ENV=production faceva
      # saltare le devDependencies - la compilazione dei tipi non lo vede: lo
      # vede solo la build vera.
      - name: backend
        run: docker build -t prova-backend ./backend-py

      - name: frontend
        run: |
          docker build -t prova-frontend \
            --build-arg VITE_PUBLIC_MINIO_URL=https://esempio.invalid \
            ./frontend
