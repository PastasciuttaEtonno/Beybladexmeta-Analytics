# I controlli di sicurezza, secondo la OWASP DevSecOps Guideline.
#
# L'obiettivo dichiarato della guida e' uno solo: "scoprire i problemi di
# sicurezza il prima possibile". Prima significa qui - sul push, accanto al
# codice - e non a un pentest fra sei mesi, quando la correzione costa cento
# volte tanto e va coordinata con un rilascio.
#
# Sono sei lavori e girano in parallelo. La prima esecuzione NON e' stata
# scritta a indovinare: ogni soglia qui sotto viene da una scansione vera di
# questo repo, ed e' documentata in docs/sicurezza.md.
#
#   segreti      gitleaks su tutta la storia - 430 commit, zero perdite vere
#   sast         semgrep: il codice letto senza eseguirlo
#   sca          le dipendenze di altri, che sono la maggioranza del codice
#   iac          Dockerfile e compose: la configurazione e' codice anche lei
#   immagini     trivy sulle due immagini vere, non sui manifest
#   conformita'  le promesse di QUESTO progetto (tools/conformita.py)
#
# Cosa NON sta qui, e perche':
#
#   DAST   sta in dast.yml. Vuole lo stack acceso e ci mette minuti, non
#          secondi: a ogni push verrebbe disattivato entro un mese.
#   IAST   non e' implementato. Non e' una dimenticanza - vedi docs/sicurezza.md
#          per il ragionamento, che si riassume in: per FastAPI non esiste un
#          agente IAST libero che faccia davvero il mestiere, e chiamare IAST
#          qualcos'altro sarebbe peggio che non averlo.
#
# Sul bloccare o solo segnalare. Un controllo che segnala e basta viene letto
# per due settimane e poi mai piu'; uno che blocca su rumore viene disattivato
# ancora prima. La regola qui e': si blocca solo dove la prima scansione ha
# dato zero falsi positivi, e si segnala dove il rumore c'e' ancora. Quale sia
# quale e' scritto lavoro per lavoro.

name: sicurezza

# Ogni lavoro qui legge e basta. `security-events: write` sta SUL SINGOLO
# lavoro che carica i SARIF, non qui, cosi' gli altri cinque non ce l'hanno.
permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Lunedi' alle 5:00 UTC. Le dipendenze non cambiano quando le tocchi tu:
    # una CVE pubblicata di domenica riguarda il codice fermo da mesi, e senza
    # un giro periodico la scopriresti al prossimo push, che potrebbe non
    # arrivare mai.
    - cron: "0 5 * * 1"

concurrency:
  group: sicurezza-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 1. Perdite di credenziali - BLOCCA
  # ------------------------------------------------------------------
  # Blocca perche' se lo passa oggi lo passa sempre: la storia e' pulita
  # (430 commit, quattro segnalazioni tutte false, allowlist in .gitleaks.toml).
  # Ed e' l'unico controllo di questa linea la cui correzione non e' una
  # correzione: una chiave finita in un commit va RUOTATA, perche' cancellarla
  # non la toglie dai cloni gia' fatti. Trovarla al push e' l'unico momento in
  # cui costa poco.
  segreti:
    name: credenziali nella storia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Senza questo la checkout prende un commit solo e gitleaks
          # scansionerebbe una storia lunga uno.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ------------------------------------------------------------------
  # 2. SAST - SEGNALA (e carica i risultati)
  # ------------------------------------------------------------------
  # Segnala e non blocca, per un motivo misurato: la prima scansione ha dato
  # 69 segnalazioni, di cui 50 di una sola regola (avoid-sqlalchemy-text) che
  # su questo codice e' sistematicamente sbagliata - qui `text()` si usa
  # ovunque CON i parametri legati, che e' il modo giusto di usarlo.
  # Quella regola e' esclusa sotto. Delle 19 restanti nessuna e' sfruttabile,
  # ma tre sono irrigidimenti veri (vedi docs/sicurezza.md).
  #
  # Diventera' bloccante quando quelle tre saranno chiuse: e' scritto li'.
  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Solo questo lavoro carica un SARIF, quindi solo questo ha il permesso.
      security-events: write
    container:
      image: semgrep/semgrep:1.97.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: semgrep
        # --exclude-rule e non una modifica al codice: sopprimere 50 volte con
        # un commento inline sporcherebbe 50 punti del backend per una regola
        # che non si applica a nessuno di essi.
        run: |
          semgrep scan \
            --config=p/default \
            --config=p/security-audit \
            --config=p/secrets \
            --exclude-rule=python.sqlalchemy.security.audit.avoid-sqlalchemy-text.avoid-sqlalchemy-text \
            --metrics=off \
            --sarif --output=semgrep.sarif \
            || true

      - name: carica i risultati
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ------------------------------------------------------------------
  # 3. SCA - BLOCCA su ALTA/CRITICA con correzione disponibile
  # ------------------------------------------------------------------
  # "Con correzione disponibile" e' la parte che decide se questo lavoro serve
  # o no. Una CVE senza patch non e' azionabile: bloccare su quelle vuol dire
  # una linea rossa che nessuno puo' far tornare verde, e una linea rossa
  # permanente e' esattamente come non avere la linea.
  sca:
    name: SCA (dipendenze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # pip-audit legge il lock, non l'ambiente installato: vede quello che
      # finira' davvero nell'immagine, comprese le dipendenze transitive che
      # pyproject.toml non nomina.
      - name: dipendenze python
        working-directory: backend-py
        run: |
          uv export --frozen --no-dev --format requirements-txt > requisiti.txt
          uvx pip-audit@2.9.0 --requirement requisiti.txt --strict

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --omit=dev di proposito: qui si guarda solo cio' che arriva agli
      # utenti. Le devDependencies non finiscono nell'immagine - il frontend
      # in produzione e' nginx che serve file statici - e una falla in uno
      # strumento di compilazione non e' un buon motivo per fermare un
      # rilascio. Per quelle c'e' `sca-sviluppo` qui sotto.
      - name: dipendenze del frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # ------------------------------------------------------------------
  # 3b. SCA sugli strumenti di sviluppo - SEGNALA
  # ------------------------------------------------------------------
  # Separato dal precedente perche' risponde a una domanda diversa: non "cosa
  # arriva agli utenti" ma "cosa gira sulla macchina di chi sviluppa e su
  # questo runner". E' un rischio vero (un pacchetto compromesso qui legge i
  # segreti della CI) ma di urgenza diversa, e mescolarlo al lavoro sopra
  # renderebbe quest'ultimo rosso per motivi che non riguardano la produzione.
  #
  # Oggi passa: le due segnalazioni con cui e' nato (vite/esbuild, il server di
  # sviluppo) sono chiuse salendo a vite 6.4.3. `continue-on-error` resta per
  # la prossima, cosi' una falla in uno strumento non blocca un rilascio che
  # non la contiene - ma la si vede.
  sca-sviluppo:
    name: SCA (strumenti di sviluppo, informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit, tutto compreso
        working-directory: frontend
        run: npm audit --audit-level=high

  # ------------------------------------------------------------------
  # 4. IaC - BLOCCA
  # ------------------------------------------------------------------
  # Qui non c'e' Terraform ne' Helm: l'infrastruttura di questo progetto sono
  # due Dockerfile e due compose, distribuiti da Coolify. Sono codice come il
  # resto e si rompono allo stesso modo, quindi si controllano allo stesso modo.
  #
  # Blocca perche' la prima scansione ha dato tre segnalazioni in tutto, tutte
  # e tre vere o spiegate: le spiegazioni stanno in .hadolint.yaml e
  # .checkov.yaml, ognuna col suo perche'.
  iac:
    name: IaC (Dockerfile e compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: hadolint sul backend
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: backend-py/Dockerfile
          config: .hadolint.yaml
          # Esplicita perche' il default dell'azione ferma anche sugli "info",
          # e fra gli info c'e' DL3066 (id utente non numerico), che scatta su
          # `USER app` nel backend. E' un'osservazione giusta ma non un
          # difetto, e non vale una linea rossa.
          failure-threshold: warning

      - name: hadolint sul frontend
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          config: .hadolint.yaml
          # Esplicita perche' il default dell'azione ferma anche sugli "info",
          # e fra gli info c'e' DL3066 (id utente non numerico), che scatta su
          # `USER app` nel backend. E' un'osservazione giusta ma non un
          # difetto, e non vale una linea rossa.
          failure-threshold: warning

      # Checkov guarda anche i workflow di questa cartella: e' il controllo che
      # ha trovato che controlli.yml girava senza un blocco `permissions`, e
      # quindi col token in scrittura su tutto il repo.
      - name: checkov
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # master del 2026-09-09
        with:
          directory: .
          config_file: .checkov.yaml
          framework: dockerfile,github_actions,secrets
          quiet: true
          soft_fail: false

  # ------------------------------------------------------------------
  # 5. Le immagini - BLOCCA solo su CVE correggibili
  # ------------------------------------------------------------------
  # La soglia di questo lavoro e' l'unica che sarebbe stata sbagliata a
  # indovinarla, ed e' il motivo per cui e' stata misurata prima: l'immagine
  # del backend ha 54 CVE ALTA/CRITICA, e per ZERO di esse Debian ha una
  # correzione. Sono il fondo di magazzino di python:3.12-slim - zlib, perl,
  # util-linux - e non dipendono da niente che facciamo noi.
  #
  # Senza --ignore-unfixed questo lavoro sarebbe rosso dal primo giorno per
  # sempre, e verrebbe spento entro un mese. Con --ignore-unfixed dice una
  # cosa sola ma vera: "esiste una patch e non l'avete presa".
  immagini:
    name: immagini (trivy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: backend
            contesto: ./backend-py
          - nome: frontend
            contesto: ./frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: costruisci ${{ matrix.nome }}
        run: |
          docker build -t prova-${{ matrix.nome }} \
            --build-arg VITE_PUBLIC_MINIO_URL=https://esempio.invalid \
            ${{ matrix.contesto }}

      - name: trivy su ${{ matrix.nome }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: prova-${{ matrix.nome }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # ------------------------------------------------------------------
  # 6. Conformita' - BLOCCA
  # ------------------------------------------------------------------
  # Gli scanner sopra sanno cercare i problemi che hanno tutti i progetti.
  # Questo controlla le promesse che ha fatto QUESTO progetto: il cookie
  # `httponly`, la Swagger chiusa, il dump della CI senza persone dentro.
  # Nessuno scanner del mondo puo' saperle, e sono esattamente quelle che si
  # rompono in silenzio durante una migrazione.
  #
  # Non serve niente per girare: ne' database, ne' rete, ne' segreti.
  conformita:
    name: le regole di questo progetto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: conformita
        run: python3 tools/conformita.py
