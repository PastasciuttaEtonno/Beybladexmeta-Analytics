# Chi tiene aggiornati i riferimenti fissati.
#
# Questo file esiste come CONSEGUENZA dei pin sugli SHA, non a fianco. Fissare
# un'azione a uno SHA la congela: nessuno la sposta a tua insaputa, ma nemmeno
# le correzioni di sicurezza arrivano piu' da sole. Senza qualcuno che li
# aggiorni, in un anno i pin diventano il problema che dovevano risolvere -
# undici azioni ferme a una versione con dentro una falla nota, e la sicurezza
# in piu' rispetto a un tag mobile e' zero.
#
# Dependabot capisce i pin `@<sha> # <versione>`: aggiorna lo SHA e riscrive il
# commento, quindi la PR resta leggibile invece di essere quaranta caratteri
# esadecimali che cambiano.

# Perche' i gruppi qui sotto raccolgono solo minor e patch.
#
# La prima versione di questo file raggruppava TUTTO (`patterns: ["*"]` e
# basta), per non aprire venti PR a settimana. Il risultato, alla prima
# esecuzione vera, e' stata una PR sola con dentro venti pacchetti e due
# cambi di major: Tailwind 3->4, che sposta il plugin PostCSS in
# `@tailwindcss/postcss`, e TypeScript 5->6, che ha rimosso `baseUrl` da
# tsconfig. La CI l'ha bocciata, giustamente, e la PR era immergibile:
# per sistemarla servivano due migrazioni separate, dentro un cambiamento
# che ne conteneva altri diciotto scollegati.
#
# L'errore non era raggruppare, era raggruppare cose di natura diversa.
# Un minor e una patch si leggono insieme e si fondono insieme; un major
# e' un lavoro, e vuole una PR sua dove il rosso della CI dice una cosa
# precisa ("Tailwind 4 vuole una migrazione") invece che "qualcosa fra
# venti pacchetti si e' rotto".

version: 2
updates:
  # Le azioni. E' la parte che conta davvero: girano con il GITHUB_TOKEN e
  # vedono il codice, quindi una compromessa e' un problema serio anche su un
  # repo piccolo.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Una sola PR con dentro tutto invece di undici: undici PR di manutenzione
    # a settimana non le guarda nessuno, e finiscono chiuse in blocco - che e'
    # peggio di non averle, perche' insegna a ignorarle.
    groups:
      azioni:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Le immagini di base dei due Dockerfile.
  #
  # Aggiunto DOPO aver scoperto perche' serviva: il frontend stava su
  # `1.27-alpine`, cioe' Alpine 3.21.3, con 34 CVE ALTA/CRITICA gia'
  # CORREGGIBILI dentro - openssl, libxml2, libpng, musl. Non se n'era accorto
  # nessuno perche' un tag di base non scade e non avvisa: resta li' e invecchia
  # in silenzio mentre tutto continua a funzionare.
  #
  # E' anche il posto dove l'intuizione tradisce: 1.29-alpine stava *peggio*
  # di 1.27 (35 CVE), quindi "prendi il numero piu' alto" non e' una regola.
  # Meglio che a guardarci sia qualcosa che legge gli avvisi davvero.
  - package-ecosystem: docker
    directories:
      - /backend-py
      - /frontend
    schedule:
      interval: weekly
      day: monday
    # Senza gruppo, di proposito: sono due immagini, quindi al massimo due PR,
    # e vanno guardate una per una.
    #
    # Raggrupparle sembrava innocuo e non lo era. La prima PR ha proposto
    # python 3.12 -> 3.14 e node 20 -> 26 insieme: non e' "aggiornare l'immagine
    # di base", sono due cambi di RUNTIME, ognuno capace di rompere le sue cose
    # (le wheel di asyncpg e pydantic da una parte, la build di Vite dall'altra).
    # In una PR sola il rosso della CI non dice quale dei due.
    #
    # Da sapere, perche' cambia cosa aspettarsi qui: le patch di sicurezza di
    # un'immagine NON arrivano da Dependabot. `python:3.12-slim` e' un tag
    # mobile, e le correzioni entrano da sole al `docker build` successivo.
    # Quello che Dependabot propone qui sono solo salti di versione, che sono
    # decisioni, non manutenzione. Il caso del frontend era diverso: li' era
    # fissata una VERSIONE vecchia di nginx (1.27), e nessuna ricostruzione
    # l'avrebbe mai portata ad Alpine 3.24.
    commit-message:
      prefix: "docker"

  # Le dipendenze del frontend. Solo sicurezza: il resto delle versioni si
  # muove quando lo decide chi lavora al codice, non ogni lunedi'.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  # Il backend. uv.lock e' il file che conta - e' quello che pip-audit legge in
  # sicurezza.yml, ed e' quello che finisce nell'immagine.
  - package-ecosystem: uv
    directory: /backend-py
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
