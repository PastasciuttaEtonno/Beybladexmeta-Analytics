# Local development stack for the FE/BE split + FastAPI migration.
# Usage:  docker compose -f docker-compose.dev.yml up -d
# Postgres is seeded on FIRST start from docker/initdb/*.sql.gz (prod snapshot).

services:
  db:
    # pgvector, not plain postgres: migration 0010 needs the extension.
    # Debian-based, because pgvector publishes no alpine variant — so the
    # data directory changes libc. Text index ordering is collation-dependent,
    # so do NOT reuse a volume initialised by postgres:18-alpine: run
    #   docker compose -f docker-compose.dev.yml down -v
    # and let it re-seed from docker/initdb/. The local data is a prod
    # snapshot, so there is nothing to lose.
    image: pgvector/pgvector:pg18
    container_name: beyblade-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beyblade_tracker
    ports:
      - "5433:5432"
    volumes:
      - beyblade_dev_pgdata:/var/lib/postgresql
      # Mounted file by file, not as a directory: you cannot mount anything
      # else inside a directory that is itself mounted read-only.
      # They run in filename order, so the snapshot lands before the
      # migrations that fix what the snapshot is missing.
      #
      # Il default e' docker/ci-db.sql.gz, che E' nel repo: stesso schema e
      # stessi dati di meta e tornei del database vero, senza la tabella degli
      # utenti. Chi clona il progetto ottiene quindi un sito funzionante senza
      # dover chiedere niente a nessuno.
      #
      # Chi ha accesso alla replica di produzione la usa mettendo in .env:
      #   SEED_SQL=./docker/initdb/10-beyblade.sql.gz
      # Quel file resta fuori da git perche' contiene email e hash delle
      # password (vedi .gitignore). Cambiare seed richiede `npm run db:reset`:
      # a volume gia' inizializzato Postgres ignora questa cartella.
      - ${SEED_SQL:-./docker/ci-db.sql.gz}:/docker-entrypoint-initdb.d/10-seed.sql.gz:ro
      - ./migrations/0007_unified_meta_view.sql:/docker-entrypoint-initdb.d/20-unified-meta-view.sql:ro
      - ./migrations/0008_stats_season_primary_keys.sql:/docker-entrypoint-initdb.d/30-stats-pks.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beyblade_tracker"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:latest
    container_name: beyblade-dev-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  # Il backend, col codice montato: una modifica a un file .py fa ripartire
  # uvicorn da solo. Senza, ogni cambio richiede `docker build` e la ricreazione
  # del container - e un container stantio non da' errore, da' il comportamento
  # di ieri, che e' molto piu' lento da diagnosticare.
  backend-py:
    build:
      context: ./backend-py
    container_name: beyblade-dev-api
    restart: unless-stopped
    volumes:
      # Solo il sorgente. Il .venv resta quello dell'immagine: montarci sopra
      # la cartella del progetto lo nasconderebbe e il container non troverebbe
      # piu' le dipendenze.
      - ./backend-py/app:/app/app:ro
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/beyblade_tracker
      PORT: 8000
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-non-usare-in-produzione}
      APP_BASE_URL: http://localhost:8080
      # Da dove il backend riprende la shell della SPA per riscriverne i tag
      # og:image, quando serve /combo/:id. Senza, _fetch_index_html esce
      # subito e la pagina di una combo risponde {"error":"not_found"} -
      # non a un clic dentro l'applicazione, che resta lato client, ma a un
      # link aperto da fuori o a un ricaricamento. Il nome del servizio, non
      # localhost: dentro il container quello e' il backend stesso.
      FRONTEND_ORIGIN: http://frontend
      # Le chiavi arrivano dal .env della repo, che docker compose legge da solo.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-openrouter}
      CHAT_MODEL: ${CHAT_MODEL:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      # Senza, /api/tournaments risponde ma i nomi dei tornei degradano a
      # "Tournament <uuid>" - un fallimento parziale che sembra un problema
      # dei dati invece che una variabile mancante.
      CHALLENGERMODE_REFRESH_KEY: ${CHALLENGERMODE_REFRESH_KEY:-}
      CHALLENGERMODE_API_KEY: ${CHALLENGERMODE_API_KEY:-}
      CHALLENGERMODE_AUTH_URL: ${CHALLENGERMODE_AUTH_URL:-}
      CHALLENGERMODE_GRAPHQL_URL: ${CHALLENGERMODE_GRAPHQL_URL:-}
      CHALLENGERMODE_CACHE_TTL_MINUTES: ${CHALLENGERMODE_CACHE_TTL_MINUTES:-1440}
      # Su Windows e macOS gli eventi del filesystem non attraversano un bind
      # mount, quindi watchfiles non vedrebbe mai una modifica e --reload
      # sarebbe una promessa non mantenuta. Il polling costa un po' di CPU e
      # funziona ovunque.
      WATCHFILES_FORCE_POLLING: "true"
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
             --reload-dir /app/app"
    depends_on:
      db:
        condition: service_healthy

  # Il frontend serve la SPA e inoltra /api al backend. L'alias di rete non e'
  # decorativo: nginx proxia verso `backend-py`, e ricreando il container a mano
  # con `docker run` quell'alias si perde - il sintomo e' un 502 che sembra un
  # backend spento.
  frontend:
    build:
      context: ./frontend
      args:
        # Le foto dei componenti. Il default punta all'archivio pubblico di
        # produzione, cosi' un clone pulito vede il sito completo; il default
        # precedente era localhost:9000, dove in locale non c'e' niente e la
        # pagina si riempiva di immagini rotte. Chi ha un Garage o un MinIO
        # suo lo dichiara in .env.
        #
        # E' un argomento di BUILD: finisce dentro il bundle, quindi cambiarlo
        # richiede `docker compose ... up -d --build`, non un riavvio.
        VITE_PUBLIC_MINIO_URL: ${VITE_PUBLIC_MINIO_URL:-https://beyblades.web.92.4.170.189.sslip.io}
    container_name: beyblade-dev-web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      API_UPSTREAM: http://backend-py:8000
      PUBLIC_STORAGE_ORIGIN: ${VITE_PUBLIC_MINIO_URL:-https://beyblades.web.92.4.170.189.sslip.io}
    depends_on:
      - backend-py

volumes:
  beyblade_dev_pgdata:
