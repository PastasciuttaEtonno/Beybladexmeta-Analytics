# Cosa ZAP deve segnalare, e cosa e' gia' stato guardato in faccia.
#
# Formato: <id>	<IGNORE|WARN|FAIL>	<perche'>
# La terza colonna non e' un commento facoltativo: tools/leggi_zap.py la
# pretende, e un IGNORE senza motivo scritto viene trattato come un problema
# nascosto invece che risolto. E' l'unica difesa contro il modo in cui questi
# file marciscono - qualcuno mette a tacere una regola alle 23 di un venerdi'
# e sei mesi dopo nessuno sa piu' se era rumore o una falla.
#
# La soglia e' MEDIO (vedi SOGLIA in tools/leggi_zap.py). Sulla prima scansione
# vera - 59 controlli passati, 8 avvisi, 0 fallimenti - solo due regole
# arrivano a MEDIO, ed entrambe sono qui sotto con il loro perche'.

# ---------------------------------------------------------------------------
# Le due che superano la soglia
# ---------------------------------------------------------------------------

# La CSP di questo sito contiene 'unsafe-inline', 'unsafe-eval' e alcuni
# caratteri jolly. Sono veri, non falsi positivi, e non sono negoziabili oggi:
# li impone la roba di Google che il sito ospita - reCAPTCHA e AdSense
# iniettano script inline e valutano codice a runtime, e i loro domini di
# servizio cambiano sotto caratteri jolly documentati da loro.
#
# Chiuderla per davvero vuol dire nonce per ogni script inline generati da
# nginx a ogni richiesta, e verificare che reCAPTCHA li rispetti. E' un lavoro
# vero, non una riga: sta in docs/sicurezza.md fra le cose da fare, non qui
# fra quelle fatte.
#
# Cosa protegge comunque, gia' adesso: default-src 'self', object-src 'none'
# e frame-ancestors 'none'. Le tre che fermano il clickjacking e i plugin
# ci sono e sono strette.
10055	IGNORE	CSP con unsafe-inline/unsafe-eval: li impongono reCAPTCHA e AdSense. Debito scritto in docs/sicurezza.md, non rumore.

# Subresource Integrity mancante sugli script di terzi. Qui la regola chiede
# una cosa che il fornitore rende impossibile: gli script di Google
# (recaptcha, adsense) sono serviti senza versione e cambiano contenuto senza
# preavviso, quindi un hash SRI li romperebbe al primo aggiornamento loro.
# SRI ha senso su una CDN che serve un file fisso; su questi no.
90003	IGNORE	SRI impossibile sugli script Google: cambiano contenuto senza versione, un hash li romperebbe al primo aggiornamento.

# ---------------------------------------------------------------------------
# Sotto la soglia: non bloccano, ma restano nel referto perche' vanno guardate
# ---------------------------------------------------------------------------

# 90022 Application Error Disclosure - BASSO.
# Sulla scansione e' scattata una volta sola, su /sitemap.xml, e il motivo e'
# l'ambiente e non il codice: la scansione gira senza CHALLENGERMODE_REFRESH_KEY,
# la rotta interroga un'API esterna e restituisce 500. Verificato a mano che il
# corpo della risposta NON contiene la traccia - torna un sitemap XML vuoto e
# valido, e lo stack trace resta nei registri, che e' dove deve stare.
# Lasciata a WARN e non a IGNORE apposta: se un giorno scatta su un'altra
# rotta, quella e' un'informazione che voglio vedere.
90022	WARN	Il 500 su /sitemap.xml e' ambientale (manca la chiave esterna). Verificato: il corpo non rivela la traccia.

# 90004 COEP/COOP/CORP mancanti - BASSO.
# Sono le intestazioni dell'isolamento fra origini. Andrebbero messe, ma COEP
# in particolare rompe gli iframe di terzi, che qui sono reCAPTCHA e gli
# annunci: va misurato prima, non attivato al buio.
90004	WARN	Isolamento fra origini da valutare: COEP rompe gli iframe di reCAPTCHA e AdSense, serve una prova prima.

# 10063 Permissions-Policy mancante - BASSO.
# Questa e' la piu' facile delle tre e non ha controindicazioni note: e' una
# riga in nginx.conf.template che spegne fotocamera, microfono e geolocazione,
# che questo sito non usa. Resta a WARN finche' non e' fatta.
10063	WARN	Una riga in nginx: nessuna controindicazione, semplicemente non ancora fatta.

# 10017 script da un altro dominio - BASSO. Sono Google, sono voluti, e sono
# gia' elencati uno per uno nella CSP: e' li' che si controlla chi puo'
# eseguire codice, non qui.
10017	IGNORE	Sono gli script di Google, dichiarati esplicitamente nella CSP.

# 10049 e 10109: contenuto memorizzabile e "questa e' una SPA". Informativi
# per costruzione - il secondo e' letteralmente ZAP che riconosce React.
10049	IGNORE	Informativo: dice come si comporta la cache, non se c'e' una falla.
10109	IGNORE	Informativo: ZAP ha riconosciuto una single-page app. Lo e'.
