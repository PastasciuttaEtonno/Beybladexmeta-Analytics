[project]
name = "beybladexmeta-backend-py"
version = "0.1.0"
description = "FastAPI backend. Progressively takes over routes from the Express backend (strangler fig)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "bcrypt>=4.2",
    "email-validator>=2.2",
    "pillow>=11",
    # Frontmatter in the knowledge base. Hand-rolling a parser for it is the
    # kind of shortcut that works until someone writes a list on two lines.
    "pyyaml>=6.0",
    # Generazione delle risposte (M4). Solo l'SDK ufficiale: un client HTTP
    # a mano su /v1/messages significherebbe reimplementare streaming,
    # ritentativi e tipi degli strumenti, tutta roba gia
    # risolta qui.
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    # Il driver SINCRONO, che l'applicazione non usa: lei parla al database
    # con asyncpg attraverso SQLAlchemy. Serve agli script di tools/ -
    # migrate.py e check_kb_registry.py - che sono deliberatamente scritti
    # senza tirarsi dietro FastAPI e fanno una connessione normale.
    #
    # Era gia' necessario prima che fosse dichiarato: stava installato a mano
    # nel venv di chi sviluppa e in nessun file, quindi in locale funzionava e
    # in CI no. `uv sync --frozen` installa solo cio' che e' nel lock, e nel
    # lock non c'era: il lavoro `database` di controlli.yml e' morto sul primo
    # giro vero con "Needs psycopg (or psycopg2)".
    "psycopg[binary]>=3.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
