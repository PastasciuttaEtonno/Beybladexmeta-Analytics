# Deployment descriptor for the split app (Coolify / plain Docker).
#
# Topology: ONE public origin. Traefik terminates TLS and sends everything to
# `frontend`; nginx there serves the SPA and reverse-proxies /api, /sitemap.xml
# and /combo to `backend`. Keeping a single origin means no CORS and no changes
# to the session cookie.
#
# The database is NOT defined here — it is the existing Coolify Postgres
# resource, reachable over the external `coolify` network.

services:
  # Serves the whole API. Every route was migrated off the Express backend and
  # verified against it route by route before that backend was removed; see the
  # git history for the parity harnesses if you ever need them again.
  backend-py:
    build:
      context: ./backend-py
    restart: unless-stopped
    environment:
      # SESSION_SECRET must not change: it signs the connect.sid cookies that
      # are already in people's browsers, so a new value logs everyone out.
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-}

      # Absolute URLs in the sitemap and the og:image tags.
      APP_BASE_URL: ${APP_BASE_URL}
      # /combo/:id fetches index.html from here to rewrite its OG tags. Without
      # it that route 404s — the monolith read the file off disk instead.
      FRONTEND_ORIGIN: http://frontend
      # Where the OG renderer downloads component images from.
      VITE_PUBLIC_MINIO_URL: ${VITE_PUBLIC_MINIO_URL}

      # Tournament data. Without the refresh key every tournament degrades to
      # the placeholder name "Tournament <uuid>".
      CHALLENGERMODE_API_KEY: ${CHALLENGERMODE_API_KEY:-}
      CHALLENGERMODE_AUTH_URL: ${CHALLENGERMODE_AUTH_URL:-}
      CHALLENGERMODE_GRAPHQL_URL: ${CHALLENGERMODE_GRAPHQL_URL:-}
      CHALLENGERMODE_REFRESH_KEY: ${CHALLENGERMODE_REFRESH_KEY:-}
      # Express defaults to 1440 when unset; keep the two in step.
      CHALLENGERMODE_CACHE_TTL_MINUTES: ${CHALLENGERMODE_CACHE_TTL_MINUTES:-1440}

      # Account linking. Separate credentials from the service key above.
      CM_CLIENT_ID: ${CM_CLIENT_ID:-}
      CM_CLIENT_SECRET: ${CM_CLIENT_SECRET:-}
      CM_USERINFO_URL: ${CM_USERINFO_URL:-}
      CHALLONGE_API_KEY: ${CHALLONGE_API_KEY:-}
      CHALLONGE_APP_CLIENT_ID: ${CHALLONGE_APP_CLIENT_ID:-}
      CHALLONGE_APP_CLIENT_SECRET: ${CHALLONGE_APP_CLIENT_SECRET:-}

      # Registration: captcha verification and the verification email.
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}

      # L'assistente. Senza VOYAGE_API_KEY non c'e' recupero (embedding e
      # re-rank passano di li'), senza la chiave del fornitore non c'e'
      # generazione: in entrambi i casi /api/chat risponde 503 e il resto del
      # sito continua a funzionare, che e' il motivo per cui si puo' distribuire
      # prima di avere le chiavi.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Pronta per il passaggio a Claude: bastano questa e CHAT_PROVIDER=claude.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Il default del CODICE e' 'claude'. Qui si dichiara openrouter come fa il
      # compose di sviluppo, cosi' le due macchine si comportano allo stesso
      # modo anche quando la variabile in Coolify non c'e'.
      CHAT_PROVIDER: ${CHAT_PROVIDER:-openrouter}
      # Vuote di proposito: env_str() tratta la stringa vuota come "non
      # impostata" e applica il default del codice.
      CHAT_MODEL: ${CHAT_MODEL:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-}
      VOYAGE_RERANK_MODEL: ${VOYAGE_RERANK_MODEL:-}
    networks:
      - app
      - coolify

  frontend:
    build:
      context: ./frontend
      args:
        # Build-time only: these are baked into the JS bundle, so changing them
        # requires a REBUILD, not a restart.
        VITE_PUBLIC_MINIO_URL: ${VITE_PUBLIC_MINIO_URL}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
        VITE_RECAPTCHA_USE_ENTERPRISE: ${VITE_RECAPTCHA_USE_ENTERPRISE:-}
    restart: unless-stopped
    environment:
      # Where nginx sends /api, /sitemap.xml and /combo. It stays a variable so
      # the upstream can be repointed without rebuilding the image; there is no
      # second backend to point it at any more.
      API_UPSTREAM: ${API_UPSTREAM:-http://backend-py:8000}
      # Added to the CSP connect-src so the browser may talk to Garage.
      PUBLIC_STORAGE_ORIGIN: ${VITE_PUBLIC_MINIO_URL}
    depends_on:
      - backend-py
    networks:
      - app
      - coolify
    # Coolify: set the domain on THIS service. Note from the Garage deploy that
    # SERVICE_FQDN magic did not always emit Traefik labels — if the router does
    # not appear, add explicit traefik.* labels plus traefik.docker.network=coolify.
    expose:
      - "80"

networks:
  app:
    driver: bridge
  coolify:
    external: true
