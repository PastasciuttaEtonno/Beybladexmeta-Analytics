version: '3.8'

services:
  # Servizio Database PostgreSQL
  postgres:
    image: postgres:18  # Puoi scegliere la versione di Postgres che preferisci
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin           # Scegli il tuo nome utente
      POSTGRES_PASSWORD: "Ciaone123"        # Scegli la tua password
      POSTGRES_DB: mydatabase        # Scegli il nome del tuo database
    ports:
      - "5432:5432"  # Mappa la porta del container alla tua macchina host
    volumes:
      - pgdata:/var/lib/postgresql  # Persistenza dei dati
    networks:
      - postgres-net

  # Servizio pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com  # Email per il login a pgAdmin
      PGADMIN_DEFAULT_PASSWORD: "Ciaone123"             # Password per il login a pgAdmin
    ports:
      - "5050:80"  # Accedi a pgAdmin su http://localhost:5050
    depends_on:
      - postgres     # Attende che il database sia avviato prima di partire
    networks:
      - postgres-net

  # Object Storage (MinIO)
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: "Ciaone123"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console: http://localhost:9001
    volumes:
      - minio_data:/data
    networks:
      - storage-net

  # MinIO Client to create buckets at startup
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh","-c"]
    command: >
      "mc alias set local http://minio:9000 admin Ciaone123 && \
       mc mb --ignore-existing local/app-public && \
       mc mb --ignore-existing local/app-private && \
       mc anonymous set download local/app-public && \
       echo 'MinIO buckets ready'"
    networks:
      - storage-net

# Definiamo la rete e il volume
networks:
  postgres-net:
    driver: bridge
  storage-net:
    driver: bridge

volumes:
  pgdata: # Il volume gestito da Docker per i dati del DB
  minio_data: